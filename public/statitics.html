<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSM Business -- Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:          #f5f4f0;
            --bg-surface:  #ffffff;
            --bg-card:     #ffffff;
            --bg-elevated: #f9f8f5;
            --bg-input:    #ffffff;
            --accent:      #4f46e5;
            --accent-dim:  rgba(79,70,229,0.08);
            --success:     #16a34a;
            --success-dim: rgba(22,163,74,0.1);
            --danger:      #dc2626;
            --danger-dim:  rgba(220,38,38,0.08);
            --warning:     #d97706;
            --warning-dim: rgba(217,119,6,0.1);
            --text-1: #1c1917;
            --text-2: #44403c;
            --text-3: #78716c;
            --text-4: #a8a29e;
            --border:       #e5e2db;
            --border-focus: #4f46e5;
            --radius-sm:   5px;
            --radius-md:   8px;
            --radius-lg:   12px;
            --radius-xl:   14px;
            --radius-pill: 9999px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.05);
            --transition: 0.18s ease;
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-1);
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            position: sticky; top: 0; z-index: 100;
            padding: 12px 28px;
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: var(--shadow-sm);
        }
        .header-brand { display: flex; align-items: center; gap: 10px; }
        .brand-mark {
            width: 30px; height: 30px; background: var(--accent);
            border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
            font-size: 0.82rem; font-weight: 700; color: white;
        }
        .brand-name { font-size: 0.92rem; font-weight: 600; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
            padding: 7px 14px; border-radius: var(--radius-md); font-size: 0.81rem; font-weight: 500;
            border: 1px solid transparent; cursor: pointer; text-decoration: none; transition: all var(--transition);
        }
        .btn-ghost { background: transparent; color: var(--text-2); border-color: var(--border); }
        .btn-ghost:hover { background: var(--bg-elevated); color: var(--text-1); }
        
        .container { max-width: 1000px; margin: 28px auto; padding: 0 20px; }
        .page-heading { margin-bottom: 22px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .page-heading h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-1); }
        
        .controls-bar {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 14px 18px; display: flex; align-items: center; gap: 12px; margin-bottom: 20px; box-shadow: var(--shadow-sm);
        }
        .styled-select {
            padding: 7px 12px; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: var(--radius-md); font-size: 0.83rem; font-family: inherit; outline: none; min-width: 150px;
            color: var(--text-1); cursor: pointer; transition: border-color var(--transition);
        }
        .styled-select:focus { border-color: var(--border-focus); box-shadow: 0 0 0 2px var(--accent-dim); }
        
        .stats-grid { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 24px; box-shadow: var(--shadow-sm); flex: 1; min-width: 300px;
        }
        .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: var(--text-2); }
        
        .summary-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .summary-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: var(--bg-elevated); border-radius: var(--radius-md);
            font-size: 0.87rem; font-weight: 500; color: var(--text-2); border: 1px solid var(--border);
        }
        .summary-value { font-weight: 700; color: var(--text-1); font-size: 1.05rem; }
        
        .table-wrap {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
            overflow-x: auto; -webkit-overflow-scrolling: touch; box-shadow: var(--shadow-sm); margin-bottom: 40px;
        }
        table { width: 100%; border-collapse: collapse; min-width: 650px; }
        thead tr { background: var(--bg-elevated); border-bottom: 1px solid var(--border); }
        th { padding: 14px 16px; text-align: left; font-size: 0.73rem; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; }
        tbody tr { border-bottom: 1px solid var(--border); transition: background var(--transition); }
        tbody tr:hover { background: #fafaf8; }
        tbody tr:last-child { border-bottom: none; }
        td { padding: 14px 16px; font-size: 0.85rem; color: var(--text-1); vertical-align: middle; }
        .td-amount { font-weight: 600; color: var(--success); }
        .badge {
            padding: 3px 10px; border-radius: var(--radius-pill); font-size: 0.72rem; font-weight: 600;
            background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-2); text-transform: capitalize;
        }

        @media (max-width: 700px) {
            .controls-bar { flex-direction: column; align-items: stretch; padding: 18px; }
            .header { padding: 12px 14px; }
            .container { margin: 20px auto; padding: 0 14px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-brand">
            <div class="brand-mark">B</div>
            <div class="brand-name">BSM Business</div>
        </div>
        <a href="/" class="btn btn-ghost">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Dashboard
        </a>
    </div>

    <div class="container">
        <div class="page-heading">
            <h1 id="pageHeading">Statistics</h1>
        </div>

        <div class="controls-bar">
            <span style="font-size: 0.75rem; font-weight: 600; color: var(--text-4); text-transform: uppercase; letter-spacing: 0.5px;">Month</span>
            <select id="monthSelect" class="styled-select"></select>
        </div>

        <div class="stats-grid">
            <div class="card">
                <h2>Summary</h2>
                <ul id="summaryList" class="summary-list"></ul>
            </div>
            <div class="card" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <div style="position: relative; height: 230px; width: 100%; display: flex; justify-content: center;">
                    <canvas id="paymentChart"></canvas>
                </div>
            </div>
        </div>

        <div class="table-wrap">
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Villa</th>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Method</th>
                        <th>By</th>
                        <th>Ref</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        var fullData, currentMonth, currentYear, currentYearN, data;
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        
        fetch("/api/month-statitics")
            .then(res => res.json())
            .then(res => {
                fullData = res.data.sort((a, b) => {
                    let [aMonth, aYear] = a.month.split("/").map(Number);
                    let [bMonth, bYear] = b.month.split("/").map(Number);
                    return bYear - aYear || bMonth - aMonth;
                });

                if (fullData.length > 0) {
                    data = fullData[0].data;
                    let [latestMonth, latestYear] = fullData[0].month.split("/");
                    currentMonth = Number(latestMonth);
                    currentYear = latestYear;
                    currentYearN = latestYear;
                    render();
                }

                const selectMonthButton = document.getElementById("monthSelect");
                fullData.forEach((val, index) => {
                    const option = document.createElement("option");
                    option.value = index;
                    option.textContent = val.month;
                    selectMonthButton.appendChild(option);
                });
            });

        let chart;
        document.getElementById("monthSelect").onchange = (e) => {
            let selectedData = fullData[e.target.value];
            if (!selectedData) return;

            let [selectedMonth, selectedYear] = selectedData.month.split("/");
            currentMonth = Number(selectedMonth);
            currentYear = selectedYear;
            currentYearN = selectedYear;
            data = selectedData.data;
            render();
        };

        let render = () => {
            document.getElementById('pageHeading').textContent = `Statistics - ${monthNames[currentMonth - 1]} ${currentYear}`;
            
            const paymentHistory = [];
            let totalReceived = 0;
            let totalPending = 0;
            const byCounts = { B: 0, S: 0, M: 0 };

            data.forEach(flat => {
                flat.persons.forEach(person => {
                    totalPending += person.pending;
                    person.history.forEach(history => {
                        const historyDate = new Date(history.date);
                        const historyMonth = (historyDate.getMonth() + 1).toString().padStart(2, "0");
                        const historyYear = historyDate.getFullYear().toString();
                        const currentMonthYear = `${currentMonth.toString().padStart(2, "0")}/${currentYearN}`;

                        if (`${historyMonth}/${historyYear}` === currentMonthYear) {
                            history.name = person.name;
                            history.flat = flat.name;
                            paymentHistory.push(history);
                            
                            const amt = Number(history.amount) || 0;
                            totalReceived += amt;

                            if (history.by && byCounts[history.by] !== undefined) {
                                byCounts[history.by] += amt;
                            }
                        }
                    });
                });
            });

            const formatMoney = (num) => Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            const summaryList = document.getElementById('summaryList');
            summaryList.innerHTML = `
                <li class="summary-item">
                    <span>Total Pending</span>
                    <span class="summary-value" style="color: var(--danger)">${formatMoney(totalPending)}</span>
                </li>
                <li class="summary-item">
                    <span>Total Received</span>
                    <span class="summary-value" style="color: var(--success)">${formatMoney(totalReceived)}</span>
                </li>
                <li class="summary-item">
                    <span>Received by B</span>
                    <span class="summary-value">${formatMoney(byCounts.B)}</span>
                </li>
                <li class="summary-item">
                    <span>Received by S</span>
                    <span class="summary-value">${formatMoney(byCounts.S)}</span>
                </li>
                <li class="summary-item">
                    <span>Received by M</span>
                    <span class="summary-value">${formatMoney(byCounts.M)}</span>
                </li>
            `;

            paymentHistory.sort((a, b) => new Date(b.date) - new Date(a.date));
            let tableHTML = "";
            
            paymentHistory.forEach(({ name, flat, date, amount, method, by, transactionId }) => {
                const isUpdate = method === 'Customer Changed' || method === 'Tenant Changed';
                const displayAmt = isUpdate ? 'Update' : formatMoney(amount);
                const amtClass = isUpdate ? 'style="color: var(--text-3); font-size: 0.8rem; font-weight: 500;"' : 'class="td-amount"';
                
                tableHTML += `
                    <tr>
                        <td style="font-weight: 600;">${name}</td>
                        <td style="color: var(--text-3);">${flat}</td>
                        <td style="color: var(--text-3); font-size: 0.8rem;">${new Date(date).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })}</td>
                        <td ${amtClass}>${displayAmt}</td>
                        <td><span class="badge" ${isUpdate ? 'style="background: var(--primary); color: white; border-color: transparent;"' : ''}>${isUpdate ? 'Update' : method}</span></td>
                        <td style="font-weight: 600;">${by || '--'}</td>
                        <td style="color: var(--text-4); font-size: 0.8rem;">${transactionId || '--'}</td>
                    </tr>
                `;
            });
            
            if (paymentHistory.length === 0) {
                tableHTML = `<tr><td colspan="7" style="text-align: center; padding: 50px; color: var(--text-3);">No transactions found for this month</td></tr>`;
            }

            document.querySelector('#historyTable tbody').innerHTML = tableHTML;

            if (chart) chart.destroy();
            const ctx = document.getElementById('paymentChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Received by B', 'Received by S', 'Received by M'],
                    datasets: [{
                        data: [byCounts.B, byCounts.S, byCounts.M],
                        backgroundColor: ['#4f46e5', '#16a34a', '#d97706'],
                        borderWidth: 0,
                        hoverOffset: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { family: 'Inter', size: 12 }, usePointStyle: true, padding: 20 } }
                    },
                    cutout: '72%'
                }
            });
        };
    </script>
</body>
</html>
